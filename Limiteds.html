<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Limiteds - RoliX</title>
  <style>
    /* General Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #1e1e1e;
      color: #f1f1f1;
      line-height: 1.6;
    }

    /* Green header / navbar */
    header {
      background: #2ecc71;
      padding: 1rem;
      text-align: center;
    }

    header h1 {
      margin-bottom: 0.5rem;
    }

    nav {
      margin-top: 0.5rem;
    }

    nav a {
      color: white;
      margin: 0 0.5rem;
      text-decoration: none;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .container {
      width: 90%;
      margin: 2rem auto;
    }

    footer {
      text-align: center;
      margin: 2rem 0;
      padding: 1rem;
      background: #2ecc71;
      color: white;
    }
  </style>
</head>
<body>
  <!-- Green header / navbar -->
  <header>
    <h1>Welcome to RoliX [Testing]</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="About.html">About</a>
      <a href="Updates.html">Updates</a>
    </nav>
  </header>

  <div class="container" id="item-container">
    <!-- Item info will appear here via script -->
  </div>

  <footer>
    <p>&copy; 2025 RoliX Testing</p>
  </footer>

  <script>
    const params = new URLSearchParams(window.location.search);
    const itemKey = params.get('item')?.toLowerCase();

    const items = {
      dominusemp: { name: "Dominus Empyreus", value: 60000, rap: 11000 },
      dominusfrigidus: { name: "Dominus Frigidus", value: 15700, rap: 6988 },
      dominusaureus: { name: "Dominus Aureus", value: 40000, rap: 4092 },
      dominusastra1: { name: "Dominus Astra", value: 25000, rap: 15000 },
      dominusastra2: { name: "Dominus Infernus", value: 35000, rap: 9675 },
    };

    const container = document.getElementById('item-container');

    if(items[itemKey]){
      container.innerHTML = `
        <h2>${items[itemKey].name}</h2>
        <p>Value: ${items[itemKey].value.toLocaleString()}</p>
        <p>RAP: ${items[itemKey].rap.toLocaleString()}</p>
      `;
    } else if(itemKey){
      container.innerHTML = "<h2>Item not found</h2>";
    }
  </script>
</body>
</html>
