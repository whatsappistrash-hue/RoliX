<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Limiteds - RoliX</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background-color: #1e1e1e; color: #f1f1f1; line-height: 1.6; }

  /* Header / navbar */
  header { background: #2ecc71; padding: 1rem; text-align: center; }
  header h1 { margin-bottom: 0.5rem; }
  nav { margin-top: 0.5rem; }
  nav a { color: white; margin: 0 0.5rem; text-decoration: none; }
  nav a:hover { text-decoration: underline; }

  .container { width: 90%; max-width: 1000px; margin: 2rem auto; }

  /* Item layout */
  .item-layout { display: flex; gap: 2rem; flex-wrap: wrap; background: #2a2a2a; padding: 1rem; border-radius: 8px; }
  
  .item-image {
    flex: 1 1 200px;
    display: flex;              /* Center image */
    justify-content: center;
    align-items: center;
    background: #1f1f1f;        /* Match the stat cards */
    padding: 1rem;
    border-radius: 8px;
  }
  .item-image img {
    width: 220px;               /* Slightly bigger */
    height: 220px;
    object-fit: contain;
    border-radius: 8px;
  }

  .item-stats { flex: 2 1 300px; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .stat { background: #1f1f1f; padding: 1rem; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
  .stat h4 { color: #2ecc71; margin-bottom: 0.5rem; font-size: 0.9rem; }
  .stat p { font-size: 0.9rem; }

  footer { text-align: center; margin: 2rem 0; padding: 1rem; background: #2ecc71; color: white; }

</style>
</head>
<body>
  <header>
    <h1>Welcome to RoliX [BETA]</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="About.html">About</a>
      <a href="Updates.html">Updates</a>
    </nav>
  </header>

  <div class="container" id="item-container">
    <!-- Item info will be dynamically inserted here -->
  </div>

  <footer>
    <p>&copy; 2025 RoliX Testing</p>
  </footer>

<script>
const params = new URLSearchParams(window.location.search);
const itemKey = params.get('item')?.toLowerCase();

const items = {
  dominusempyreus: { 
    name: "Dominus Empyreus", 
    value: 60000, 
    rap: 11000, 
    type: "Hat", 
    img: "https://www.pekora.zip/images/thumbnails/c28f676a9e4fd9b7891ccce63ba37b4d1f5740229775edb35e44f1808d292a60.png",
    demand: "Unknown",
    trend: "Unknown"
  },
  dominusfrigidus: { 
    name: "Dominus Frigidus", 
    value: 15700, 
    rap: 6988, 
    type: "Hat", 
    img: "https://www.pekora.zip/images/thumbnails/11195b53b88df822f463962193263b14765f4c87fd74540089c1b8b7e3386972.png",
    demand: "Good",
    trend: "Rising"
  },
  dominusaureus: { 
    name: "Dominus Aureus", 
    value: 40000, 
    rap: 4092, 
    type: "Hat", 
    img: "https://www.pekora.zip/images/thumbnails/100bd3154ec319beef60e7f3a90c1011d056c2c6a5bf74a442b0ac0297871d60.png",
    demand: "Medium",
    trend: "Stable"
  },
  dominusformidulosus: { 
    name: "Dominus Formidulosus (Hi Khriss)", 
    value: 2100, 
    rap: 1672, 
    type: "Hat", 
    img: "https://www.pekora.zip/images/thumbnails/cf58981745291b2fd30db587ebecd5a192a2a1d7df09b496dfd621ffde65f299.png",
    demand: "Decent",
    trend: "Stable"
  },
  dominusastra: { 
    name: "Dominus Astra", 
    value: 25000, 
    rap: 15000, 
    type: "Hat", 
    img: "https://www.pekora.zip/images/thumbnails/51618d3bd5c7e48c44957e3da9d233e5cd8fe0b018523ced92e77a21399f52fa.png",
    demand: "High",
    trend: "Rising"
  },
  dominusinfernus: { 
    name: "Dominus Infernus", 
    value: 35000, 
    rap: 9675, 
    type: "Hat", 
    img: "https://www.pekora.zip/images/thumbnails/bf8b3905d00b79847d068397e6fa38de62898dda2e99d188a8161698ee088621.png",
    demand: "High",
    trend: "Rising"
  },
};

const container = document.getElementById('item-container');

if(items[itemKey]){
  container.innerHTML = `
    <div class="item-layout">
      <div class="item-image">
        <img src="${items[itemKey].img}" alt="${items[itemKey].name}">
      </div>
      <div class="item-stats">
        <div class="stat"><h4>Name</h4><p>${items[itemKey].name}</p></div>
        <div class="stat"><h4>Value</h4><p>${items[itemKey].value.toLocaleString()}</p></div>
        <div class="stat"><h4>RAP</h4><p>${items[itemKey].rap.toLocaleString()}</p></div>
        <div class="stat"><h4>Type</h4><p>${items[itemKey].type}</p></div>
        <div class="stat"><h4>Demand</h4><p>${items[itemKey].demand}</p></div>
        <div class="stat"><h4>Trend</h4><p>${items[itemKey].trend}</p></div>
      </div>
    </div>
  `;
} else if(itemKey){
  container.innerHTML = "<h2>Item not found. Did you type it correctly?</h2>";
}
</script>
</body>
</html>
